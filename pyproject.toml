[project]
name = "giveaway-quest"
version = "1.1.1"
description = "Give away digital codes (game keys etc.) to verified Fediverse people, with a little quest."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "litestar[jinja,cryptography]>=2.24,<3",
    "uvicorn>=0.52",
    "httpx>=0.28",
    "coolname>=2.2",
    "cyclopts>=4.0",
    "python-dotenv>=1.0",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
]

[project.scripts]
gq = "giveaway_quest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "invoke>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["giveaway_quest"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
