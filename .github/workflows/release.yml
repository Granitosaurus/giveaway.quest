name: release

# "Run workflow" button (Actions tab, or the GitHub mobile app): runs the
# same `invoke release` as a local release -- bump version, tag, push, GitHub
# release from NEW.md. Production (stork) picks the tag up within 5 minutes
# via giveaway-quest-deploy.timer; nothing here can reach the server.
#
# Pushing the bump commit to main and the v* tag relies on the repo rulesets
# letting GitHub Actions bypass them (only the owner and Actions may push
# main or create v* tags).
on:
  workflow_dispatch:
    inputs:
      part:
        description: Version part to bump
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version bump and `git describe`
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -W error::DeprecationWarning
      - name: release
        env:
          PART: ${{ inputs.part }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch --set-upstream-to=origin/main
          uv run invoke release "$PART"
