{% extends "base.html" %}
{% block title %}Edit · {{ g.title }} · {{ site_name }}{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-1">Edit giveaway</h1>
<p class="text-base-content/70 mb-6"><a class="link" href="/{{ g.slug }}">{{ g.title }}</a> · the title and code can't be changed; delete and recreate instead.</p>

<form method="post" action="/{{ g.slug }}/edit" class="max-w-2xl space-y-4">
  {{ csrf_input | safe }}
  <fieldset class="fieldset bg-base-100 rounded-box shadow-sm p-5 gap-4">
    <label class="floating-label">
      <span>Quest</span>
      <textarea name="quest" class="textarea w-full" rows="2" maxlength="2000">{{ g.quest or '' }}</textarea>
    </label>
    <label class="floating-label">
      <span>Conditions</span>
      <textarea name="conditions" class="textarea w-full" rows="3" maxlength="2000">{{ g.conditions or '' }}</textarea>
    </label>
    <label class="floating-label">
      <span>Ends in (hours from now; leave empty to keep <time datetime="{{ g.ends_at }}" data-local>{{ g.ends_at | human }}</time>)</span>
      <input name="hours" type="number" class="input w-full" min="1" max="2160" placeholder="e.g. 48" value="{{ g.hours or '' }}">
    </label>
    <label class="floating-label">
      <span>Mastodon announcement URL (link to a post about this giveaway)</span>
      <input name="post_url" type="url" class="input w-full" placeholder="https://fosstodon.org/@you/1234" value="{{ g.post_url or '' }}">
    </label>
    <label class="label cursor-pointer justify-start gap-3">
      <input type="checkbox" name="listed" class="checkbox" {% if g.listed == 1 or g.listed == 'on' %}checked{% endif %}>
      <span>Show on the {{ site_name }} front page</span>
    </label>
  </fieldset>
  <div class="flex gap-2">
    <button class="btn btn-primary">Save</button>
    <a href="/{{ g.slug }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>
{% endblock %}
