services:
  app:
    build: .
    image: giveaway-quest:latest
    restart: unless-stopped
    env_file: .env
    environment:
      GQ_DATA_DIR: /data
      # Set by `invoke redeploy`/`invoke release` (git describe or a release
      # tag) so the footer/cache-busting query string prove a deploy landed;
      # empty here just falls back to the package version (see config.py).
      GQ_VERSION: ${GQ_VERSION:-}
    volumes:
      - ./data:/data
    expose:
      - "8000"

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # Deliberately no `depends_on: [app]`: podman-compose turns that into
    # `podman create --requires=<app container>` on cloudflared, which makes
    # podman refuse to remove/recreate app while cloudflared exists ("has
    # dependent containers which must be removed before it") -- exactly the
    # error `invoke redeploy --force-recreate app` kept hitting. cloudflared
    # just proxies to app over the network at request time and reconnects
    # fine regardless of start order, so the strict requirement isn't needed.
